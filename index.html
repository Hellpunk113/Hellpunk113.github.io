<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="公民新右翼学术讨论档案">
  <title>公民新右翼学术讨论档案</title>
  <style>
    :root { --paper:#fff; --ink:#20242b; --muted:#68717d; --line:#d9dde3; --blue:#1f5f9b; --blue2:#eaf2fa; --nav:#f4f5f7; --shadow:0 12px 30px rgba(32,36,43,.12); }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--nav); color:var(--ink); font-family:"PMingLiU","MingLiU","Noto Serif CJK SC","Source Han Serif SC",serif; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .topbar { height:58px; display:flex; align-items:center; gap:16px; padding:0 24px; background:#fff; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; border:0; background:transparent; color:var(--ink); padding:0; }
    .brand img { width:32px; height:32px; object-fit:contain; }
    .brand span { font-size:16px; letter-spacing:.04em; }
    .top-spacer { flex:1; }
    .utility { color:var(--muted); font-size:13px; }
    .lang { border:1px solid var(--line); border-radius:3px; background:#fff; color:var(--ink); padding:7px 9px; }
    .menu-button { width:36px; height:34px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:3px; font-size:20px; line-height:1; }
    main { min-height:calc(100vh - 58px); }
    .home { max-width:980px; min-height:calc(100vh - 58px); margin:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:52px 24px 90px; }
    .home-logo { width:min(210px,42vw); height:min(210px,42vw); object-fit:contain; margin-bottom:25px; }
    h1,h2,h3,p { margin-top:0; }
    .home h1 { font-size:clamp(26px,4vw,42px); letter-spacing:.14em; font-weight:500; margin-bottom:10px; }
    .subtitle { color:var(--muted); font-size:14px; letter-spacing:.09em; margin-bottom:30px; }
    .search { width:min(680px,100%); display:flex; border:1px solid #c8cdd4; background:#fff; border-radius:3px; box-shadow:0 2px 6px rgba(32,36,43,.06); }
    .search input { flex:1; min-width:0; border:0; outline:0; padding:14px 16px; color:var(--ink); background:transparent; }
    .search button { border:0; border-left:1px solid var(--line); background:#f8f9fa; color:var(--blue); padding:0 19px; }
    .home-actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
    .action { border:1px solid #bcc5d0; background:#fff; color:var(--ink); padding:10px 16px; border-radius:3px; }
    .action.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
    .approach { width:min(800px,100%); margin-top:42px; padding:19px 22px; border-left:4px solid var(--blue); background:#fff; box-shadow:0 2px 8px rgba(32,36,43,.05); line-height:1.9; font-size:14px; }
    .home-footer { margin-top:28px; color:var(--muted); font-size:12px; }
    .chapter-page { max-width:1080px; margin:auto; padding:40px 28px 90px; }
    .chapter-head { display:flex; align-items:flex-start; gap:15px; border-bottom:1px solid var(--line); padding-bottom:21px; margin-bottom:30px; }
    .chapter-head img { width:44px; height:44px; object-fit:contain; flex:none; }
    .eyebrow { color:var(--blue); font-size:12px; letter-spacing:.1em; margin-bottom:8px; }
    .chapter-head h1 { font-size:clamp(25px,4vw,39px); font-weight:500; margin-bottom:5px; }
    .chapter-head p { color:var(--muted); margin-bottom:0; font-size:14px; }
    .chapter-body { background:#fff; border:1px solid var(--line); padding:clamp(25px,5vw,56px); box-shadow:var(--shadow); }
    .chapter-body h2 { font-size:25px; font-weight:500; border-bottom:1px solid var(--line); padding-bottom:15px; margin-bottom:26px; }
    .chapter-body p { font-size:16px; line-height:2.05; margin-bottom:21px; text-align:justify; }
    .chapter-note { padding:15px 18px; background:var(--blue2); border-left:3px solid var(--blue); color:#304a64; margin:29px 0; font-size:14px; line-height:1.8; }
    .chapter-nav { display:flex; justify-content:space-between; gap:12px; margin-top:18px; }
    .chapter-nav button { border:1px solid #bcc5d0; background:#fff; padding:10px 14px; border-radius:3px; color:var(--ink); }
    .chapter-nav button:disabled { opacity:.35; cursor:not-allowed; }
    .drawer-backdrop { position:fixed; inset:0; background:rgba(20,25,32,.23); z-index:20; }
    .drawer { position:fixed; z-index:21; inset:0 auto 0 0; width:min(390px,88vw); background:#fff; border-right:1px solid var(--line); box-shadow:10px 0 32px rgba(20,25,32,.18); transform:translateX(-105%); transition:transform .22s ease; overflow:auto; }
    .drawer.open { transform:translateX(0); }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; padding:21px 20px; border-bottom:1px solid var(--line); }
    .drawer-head h2 { font-size:18px; font-weight:500; margin:0; }
    .close { border:0; background:transparent; font-size:24px; color:var(--muted); }
    .toc { padding:9px; }
    .toc button { width:100%; display:flex; gap:12px; text-align:left; align-items:baseline; border:0; border-bottom:1px solid #eef0f2; background:#fff; padding:14px 11px; color:var(--ink); }
    .toc button:hover { background:var(--blue2); }
    .toc-num { color:var(--blue); font-size:13px; width:24px; }
    .toc-title { flex:1; font-size:14px; }
    .modal-backdrop { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(19,24,31,.54); }
    .modal { width:min(560px,100%); background:#fff; border:1px solid #b8c0ca; box-shadow:0 18px 60px rgba(0,0,0,.28); padding:30px; }
    .modal h2 { font-size:23px; font-weight:500; margin-bottom:18px; }
    .modal p { font-size:14px; line-height:1.9; margin-bottom:14px; }
    .modal-foot { display:flex; align-items:center; justify-content:space-between; gap:14px; border-top:1px solid var(--line); margin-top:23px; padding-top:19px; }
    .modal-foot small { color:var(--muted); }
    .confirm { border:1px solid var(--blue); background:var(--blue); color:#fff; padding:10px 15px; border-radius:3px; }
    .confirm:disabled { background:#aab5c0; border-color:#aab5c0; cursor:not-allowed; }
    .result-list { width:min(680px,100%); margin-top:13px; background:#fff; border:1px solid var(--line); }
    .result-list button { width:100%; padding:12px 16px; text-align:left; border:0; border-bottom:1px solid #edf0f2; background:#fff; }
    .result-list button:last-child { border-bottom:0; }
    .result-list button:hover { background:var(--blue2); }
    .result-list strong { color:var(--blue); margin-right:12px; }
    .hidden { display:none !important; }
    @media (max-width:650px) {
      .topbar { padding:0 14px; gap:10px; }
      .brand span { font-size:13px; }
      .utility { display:none; }
      .chapter-page { padding:25px 13px 60px; }
      .chapter-body { padding:23px 18px; }
      .chapter-body p { font-size:15px; line-height:1.95; text-align:left; }
      .modal { padding:23px 19px; }
    }
  </style>

    <section class="modal" role="dialog" aria-modal="true">
      <h2 id="disclaimerTitle">进入前说明</h2>
      <p id="disclaimerP1">本档案是个人对政治思想、制度概念与政治哲学文本的学术整理，不代表任何组织、政党、政府或现实政治行动，也不构成动员、组织、政策指令或实施方案。</p>
      <p id="disclaimerP2">作者明确维护中华人民共和国现状、中国共产党领导、国家统一与社会稳定。页面内容仅用于概念阅读、比较与批评，不应被理解为要求改变中国现有政治秩序。</p>
      <p id="disclaimerP3">部分概念来自个人思想实验，可能存在争议、遗漏或内部张力。请将其当作可检验、可质疑的档案材料阅读。</p>
      <div class="modal-foot"><small id="countdown">请等待 3 秒</small><button class="confirm" id="confirm" disabled>我已阅读，进入档案</button></div>

  <script>
    const chapters = [
      { n:"01", title:"起源与总论", en:"Origins and General Theory", summary:"关于政党竞争、民主授权、行政连续性、技术官僚与法团调和的总论。", paragraphs:[
        "政党是一个非常古老的概念。有相同兴趣的人、相同政见的人、有着相同经济分配利益的人，自然而然地站在一起，为了自己所代表的阶级而斗争，又或为了自己造福人类的理想而斗争，又可能是某个独裁者的白手套。但无论如何，现代的民主必须通过政党竞争、政治人物轮替才能延续。每届政府的重新改变都会导致行政体系形成目标的大转弯，使得发展不可存续。我们不禁要问：难道必须要这样才能实现国民主权？",
        "我们认为政客是不可信的。他们背后是资本集团，是各自阶级的利益，是商业公司包装出的塑料营销。国民拥有政治的主权，但国民不应该，也不必须把治理国家的技术工作交给通过这种虚假竞争取得职位的人。我们对一个人的认可，在当今时代可能来自所讲的那样，我们已经失去了对严肃信息严肃对待的能力。民主代表着什么？代表着主权在民。国家首先应该让国民来选择它的发展方向、它的价值优先级，以及哪些代价是可以接受的。只有在国民完成决定之后，行政机关才能够去寻找最有效、可靠和可持续的方法，去实现由国民共同决定出的目标。",
        "而政客往往会导致一切付之一炬。这正是技术官僚所应该站出来的时刻。国民决定国家要往哪里去，政府负责组织国家前进，并将相关任务拆分并递交给各个技术官僚；技术官僚则决定要如何到达我们的目标。法团则负责调和阶级矛盾，让我们的社会能够长远发展。但不同于法西斯主义，用国家和民族作为法团调和的不可或缺一环，无疑是愚蠢的。我们应该让技术官僚依照科学做出判断。是的，不同选项都会有不同的取舍。那我们要留哪些，舍哪些呢？这就要看这一年国民所选择的目标了。技术官僚自然要做出符合国民民主目标的决策，那这便是民主的法团。"
      ]},
      { n:"02", title:"国家、国民与政治主权", en:"The State, Citizens and Political Sovereignty", paragraphs:[
        "国家是提供公共服务并完成长期公共目标的行政工具，而它本身不应该有任何独立的政治意志。这和我们当今世界很多国家是不一样的。政府如果以国家意志、历史使命、民族意志所自居，那么它就是在取代国民民主表达的政治选择。国家最高的政治主权属于全体国民。国民必然要做出周期性的决定，决定国家应该追求什么，应该达到什么。",
        "国民可以选择更加重视劳动者收入的时期，也可以选择更加重视企业投资的时期；可以选择扩大社会福利，也可以选择提高国防投入；可以选择加速工业的建设，同时也可以选择保护环境。而这个国家发展的答案，从来不，也不应该由技术官僚、官员们和政客们给出一个所谓“科学正确”的答案。技术官僚可以说明每一项选择都必然带来风险。可是那又如何呢？它代表的不是大多数人的声音。价值判断必然由国民完成。",
        "那些老古董每天讲着让国民来选择谁来统治国民。可我们选出来的人最终会如何？睁开我们的眼睛看一看世界吧：腐败、独裁、集权正在迅速滋生。我们不应该选择谁来统治国民，因为最终还是让他们自己来做决定。他们可能花言巧语骗了我们，让我们选择他来当领袖，但他却不一定真的会做出我们期盼他所做的事情。所以，应该直接让我们来选择做什么事情，而不是选择谁来替我们做这个决定。这才是真正的民主，真正的一劳永逸的方法。"
      ]},
      { n:"03", title:"民主制度下的五年计划", en:"Five-Year Plans under Democracy", paragraphs:[
        "我们不是苏俄，我们也不再相信列宁说的那一套了。但以五年作为一个基本的发展周期，未必是一件错误的事情。每个五年周期开始前，我们应该用民主授权形成若干个完整的国家计划，并再提交给全体国民进行表决。它并不是传统意义上的经济计划，我们注重的也不再仅仅是生产命令体系。",
        "它所裁定的是我们在未来这些年中，技术官僚应该以什么态度去裁定国家；决定的是接下来这些年中法团要如何调节阶级矛盾；决定的是我们对于价值观的排序、对于公共支出的方向，以及重大的社会决策。哪一种方案值得执行，不再由经济学家决定，而是让我们，让人民，让公民，让国民来进行决定。民主才是客观。民主选择方案，而技术官僚不应该参政。他们应该做国民的仆人，应该为我们指明前进的路，但目的地应该让我们自己选择。"
      ]},
      { n:"04", title:"五级国民会议制度", en:"Five-Level National Civic Conference System", paragraphs:[
        "相信有不少同袍看到前面关于人民选择提案的表述，又以为这是什么技术官僚主义的新马甲。当然不是。国政组织从来不应该掌握我们的路线。我们认为应该采取五级会议的制度，让参与者围绕具体问题提交数据、财政来源、执行方式、风险与预期结果，并经过演讲、反驳与现场判断来进行逐级筛选。这不是情绪的口号，这不是民族主义之类这些蛊惑人心的东西可以再大展拳脚的地方。这是理性的、客观的，却又是民主的。",
        "我们应该把它压缩为基层、区域、专业、全国国策以及最终国家方向的五级筛选。而最终的选择必然由国民自己来完成。第一阶段，由社区、学校、工作场所、专业组织、劳动组织、企业组织以及普通国民提出国家目前存在的问题与未来政策的方向。第二阶段，在地方范围内进行方案的比较、辩论、反驳、合并和修改。第三阶段，当我们扩大到了行业范围，我们就可以让相似的方案合并，同时存在明显矛盾的方案也终将被淘汰和修正。",
        "到了第四阶段，将零散的政策组合成能够覆盖财政、经济、住房、教育、能源、外交、社会保障等主要国家事务的完整提案。而最终，我们会获得几份由全国人民根据理性判断所得出的最终国家方案，也就是我们若干份候选的全国五年计划。而在会议结束后，将由全体国民直接选择。国家路线只能产生于国民在民主上的授权。"
      ]},
      { n:"05", title:"常设政府与行政国家", en:"Permanent Government and the Administrative State", paragraphs:[
        "政府是一个永远存在的行政机关，它也不应该是某个政党的政治组织。政党应该被消灭，我们应该只有政府。所以原则上不应该再存在所谓的执政党和在野党。政党不应该拥有组阁、分配行政职位或控制国家机器的制度资格。社会团体可以宣传他们的理念，可以支持不同的五年计划，可以组织国民进行政治讨论。但是我们的行政是基于五级会议制度和直接民主选举的。",
        "也就是说，当五年计划改变时，并不意味着整个国家的行政体系和行政人员都要进行改变。财政部门、交通部门、教育部门、外交和安全机关，它们还是原来的样子。它们变化的是被重新委派的任务，而这个任务正是由全体国民民主选举产生的。所谓的总统只不过是民主的仆人，是这套常设行政体系的协调者。他并没有自己的政治纲领，他也不应该有自己的政治纲领。他更没有任何独立于五年计划的政治授权。他要做的只是将国民的授权转化成国家的任务，并确保不同的技术官僚机关可以合作。"
      ]},
      { n:"06", title:"技术官僚体系", en:"The Technocratic System", paragraphs:[
        "技术官僚拥有着高度的专业自主权，但是我们必须剥夺他们的政治主权。技术官僚制度在我们的历史中已多次出现，它的弊病一一展现。这些自大的家伙以为自己才可以决定国家的方向，而忽视了民主，这导致了国民为他们的错误判断而付出代价。所以他们不应该再拥有独立的政治主权。",
        "所谓的技术自主，是指在民主的五年计划目标已经确定以后，政府不因为短期的舆论、私人关系、个人偏好或者政治宣传而修改专业的实施方案。比如，我们的国民大会决定要扩大铁路的建设，那么线路设计、安全标准、工程方案应该让技术官僚的专业机关来决定。如果我们决定要提高工人收入，那么如何采用最低工资、税收抵免、社会保险，也应该由相关的技术官僚负责研究。",
        "他们负责的是政策的依据，是数据的来源，是风险的评估，是执行的成本，并最终给我们一个满意的结果。但他们没有资格去替我们回答或做出判断：这个社会目标值不值得追求。也不应该依赖于他们所谓的方程和函数。政治的选择权永远在国民的手里。"
      ]},
      { n:"07", title:"法团制度与阶级调和", en:"Corporatist Institutions and Class Reconciliation", paragraphs:[
        "阶级之间存在着真实的利益冲突。法团主义常常以国家和民族作为第一要素，并以国家视角来解决阶级矛盾，但这是愚蠢的。我们确实应该建立制度化的法团体系，并以国家为主体解决阶级矛盾，但我们的依据应该是民选的五年计划和技术官僚的科学判断。",
        "企业与投资者通过企业法团表达投资、利润、融资、税收、成本和经营稳定的需求。劳动者则通过劳动法团和工会来表达工资、就业、工作时间、福利和劳动条件的要求。行业组织表达不同产业的技术和发展要求。消费者也可能会有自己的想法。而这些法团将进入制度化的谈判，技术官僚担任的角色更像是协调者和政策的设计者。",
        "就像我们前面所提到的，它的判断依据来自国民的五年计划。就是说，它不能选择自己认为哪个阶级应该获得优先，或者什么是正确的，而应该来自五年计划所规定的优先关系。如果国民在这五年中选择的是一个明显提高劳动者利益的计划，那么在无法兼顾的利益冲突中，劳动收入、劳动保障和就业条件就会获得更高的权重。而如果国民选择的是鼓励企业投资的计划，那么对于投资环境、企业利益和资本积累都会有更多的权重。",

      { n:"08", title:"伦理国会与国家监察", en:"Ethical Congress and State Oversight", paragraphs:[
        "国家设立单独的伦理国会。伦理国会不是政府，不制定五年计划，也不管理经济。我们需要一个单独的监察机关来阻止我们的政府腐败。五级国民会议、常设行政政府、总统、技术官僚机构、法团、军队。我们不相信他们。",
        "伦理国会应该依据宪法和已经国民确认的基本伦理宪章进行审查。它不得自己无限创造新的标准，又反过来使用它们限制民主。它的职责在于反贪腐、程序监察、利益冲突调查、滥用职权的调查、基本权利保护，以及对国家机关违反宪制行为的调查。",

      { n:"09", title:"法律、司法与权力约束", en:"Law, Judiciary and Constraints on Power", paragraphs:[

      { n:"10", title:"政府失效与技术托管", en:"Government Failure and Technocratic Trusteeship", paragraphs:[
        "我们承认，常设的行政政府可能会发生严重的腐败、行政瘫痪、经济治理的崩溃、战争失灵，或者其他在事实上已经无法让它继续完成基本国家职能的情况。我们将它称之为事实政府失效。原则上，没有任何一个单一的机构拥有宣布政府失效的权利。总统可以承认这一事实，但是它也并非是必要条件。伦理国会也没有办法用一句话来罢免政府。",

      { n:"11", title:"军队与宪政保险机制", en:"The Military and Constitutional Safeguards", paragraphs:[
